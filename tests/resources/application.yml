
env: default

user:
  application:
      home: ~/.TAVI/

test:
  multi-substitution:
    home: ~/${user.application.home}/test


library:
  storage:
    raw:
      classification:
        quick: False
  filestore:
    raw:
      size-limit: 1  # MB
      
backend:
  model:
    fit:
      history:
        # Undo is for dialing one fit member in, not an audit trail - a handful of steps back is
        # plenty, and anything older is dropped first.
        size-limit: 10  # undo steps per fit member

ORNL:
  spice:
    file:
      ext: .dat
    metadata:
      field-name:
        def:
          - def_x
          - def_y
  instrument:
    names:
      - HB1A
      - HB1
      - HB3
      - CG4C

