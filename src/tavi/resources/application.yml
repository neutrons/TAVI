env: default

user:
  application:
      home: ~/.TAVI/

library:
  storage:
    raw:
      classification:
        quick: False
  filestore:
    raw:
      size-limit: 1  # MB
backend:
  model:
    fit:
      history:
        # Undo is for dialing one fit member in, not an audit trail - a handful of steps back is
        # plenty, and anything older is dropped first.
        size-limit: 10  # undo steps per fit member
filter:
  # The built-in, read-only filter every project starts with. Shared by the filter panel and the
  # library, so both name and recognise it the same way without the view importing the library's.
  sample:
    uuid: sample-filter
    name: Sample
    criterion:
      key: scan
      operator: ">="
      value: "0"

ORNL:
  spice:
    file:
      ext: .dat
    metadata:
      field-name:
        def:
          - def_x
          - def_y
  instrument:
    names:
      - HB1A
      - HB1
      - HB3
      - CG4C
