# Configuration file for codecov reporting code coverage

# Percentage drop allowed
coverage:
  status:
    project:
      default:
        # base on last build, but allow drop of upto this percent
        threshold: 0.5%

ignore:
  - "old_tavi/"
  - "prototpye/"
  - "src/tavi/library/"
  - "src/tavi/__main__.py"
  - "src/tavi/__init__.py"
  - "src/tavi/configuration.py"
  - "src/tavi/frontend/main_view.py"
  - "src/tavi/frontend/menubar_view.py"
  - "src/tavi/frontend/main_presenter.py"
  - "src/tavi/frontend/file_menu_presenter.py"
